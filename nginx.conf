# NGINX Configuration for EMS Guardian Production
# Static file server for the Vite build output (dist/): U1 Field app at /
# and the Unmute1AI marketing pages at /welcome/, /argus/, /accessguard/.
# TLS termination, security headers, and rate limits are unchanged from the
# previous reverse-proxy configuration. There is no upstream app server —
# the build output is the entire deployment surface.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Performance settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    # Rate limiting
    # (api/login zones retained for a future server-side tier — see /api/ below)
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS Server
    server {
        listen 443 ssl http2;
        server_name ems-guardian.medical www.ems-guardian.medical;

        # SSL Configuration
        ssl_certificate /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;
        ssl_protocols TLSv1.3 TLSv1.2;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://generativelanguage.googleapis.com; frame-ancestors 'none';" always;

        # CORS Headers
        add_header Access-Control-Allow-Origin "https://ems-guardian.medical" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-CSRF-Token" always;

        # Rate limiting
        limit_req zone=general burst=20 nodelay;

        # Static root: the build output (app at /, marketing pages in subpaths)
        root /usr/share/nginx/html;
        index index.html;

        # Health check endpoint — served locally, no app server
        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # No server-side API in this deployment — return 404 explicitly rather
        # than falling through to the SPA fallback.
        location /api/ {
            limit_req zone=api burst=10 nodelay;
            return 404;
        }

        # Main application (SPA fallback) and static marketing subpaths:
        # /welcome/, /argus/, /accessguard/ resolve from the same root.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Deny access to sensitive files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~ ~$ {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Deny access to git repository
        location /.git/ {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Deny access to environment files
        location ~ /\.(env|env.*) {
            deny all;
            access_log off;
            log_not_found off;
        }
    }

    # Status page (local only; also serves the container healthcheck)
    server {
        listen 8080;
        server_name localhost;

        location /nginx_status {
            stub_status;
            access_log off;
            allow 127.0.0.1;
            deny all;
        }

        # Plain-HTTP health endpoint for the container HEALTHCHECK —
        # loopback-only, no TLS/cert dependency in the healthcheck itself.
        location = /health {
            access_log off;
            allow 127.0.0.1;
            deny all;
            default_type text/plain;
            return 200 "ok\n";
        }
    }
}
