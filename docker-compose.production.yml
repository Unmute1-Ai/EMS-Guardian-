# Argus pilot stack: nginx (TLS) -> oauth2-proxy (agency sign-in) -> Argus API + app.
# Secrets come from .env.production (never committed). See docs/PILOT-RUNBOOK.md.
#   docker compose -f docker-compose.production.yml --env-file .env.production up -d

services:
  argus:
    build:
      context: .
      dockerfile: Dockerfile.production
    image: argus-responder:${ARGUS_VERSION:-local}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      TRUST_PROXY: "2"                     # nginx + oauth2-proxy
      COMPLIANCE_MODE: ${COMPLIANCE_MODE:-}
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_AUDIENCE: ${OIDC_CLIENT_ID}     # oauth2-proxy forwards the ID token; its audience is the client id
      OIDC_REQUIRED_ROLE: ${OIDC_REQUIRED_ROLE:-}
      OIDC_ROLES_CLAIM: ${OIDC_ROLES_CLAIM:-roles}
      AUTH_DISABLED: ${AUTH_DISABLED:-}
      GOOGLE_GENAI_USE_VERTEXAI: ${GOOGLE_GENAI_USE_VERTEXAI:-}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-us-central1}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}  # demo / synthetic data only; blocked in hipaa & fedramp modes
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_BAA: ${ELEVENLABS_BAA:-}
    expose: ["3000"]                       # never published to the host; only oauth2-proxy reaches it
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 768M }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "10" }
    networks: [internal]

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    restart: unless-stopped
    command:
      - --http-address=0.0.0.0:4180
      - --provider=oidc
      - --oidc-issuer-url=${OIDC_ISSUER}
      - --client-id=${OIDC_CLIENT_ID}
      - --upstream=http://argus:3000/
      - --email-domain=*
      - --pass-authorization-header=true   # forwards "Authorization: Bearer <id token>" to Argus
      - --set-xauthrequest=true
      - --cookie-secure=true
      - --cookie-samesite=lax
      - --cookie-expire=12h                # one shift; IdP policy decides idle timeout
      - --cookie-refresh=1h
      - --skip-provider-button=true
      - --skip-auth-route=^/health$
      - --skip-auth-route=^/ready$
      - --reverse-proxy=true
    environment:
      OAUTH2_PROXY_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET}  # 32 random bytes, base64
      OAUTH2_PROXY_REDIRECT_URL: https://${ARGUS_HOSTNAME}/oauth2/callback
    expose: ["4180"]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    depends_on:
      argus: { condition: service_healthy }
    networks: [internal]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    security_opt: ["no-new-privileges:true"]
    depends_on: [oauth2-proxy]
    networks: [internal]

networks:
  internal: {}
