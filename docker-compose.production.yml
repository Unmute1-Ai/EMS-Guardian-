services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.production
    container_name: ems-guardian-prod

    # nginx static server: TLS on 443, HTTP->HTTPS redirect on 80
    ports:
      - "80:80"
      - "443:443"

    volumes:
      # TLS certificates (operator-provided: cert.pem, key.pem)
      - ./certs:/etc/nginx/certs:ro
      # nginx access/error logs
      - ./logs/nginx:/var/log/nginx:rw

    # Security options
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

    # Health check (loopback-only endpoint on the nginx status server)
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

    # Restart policy
    restart: on-failure:5

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
        labels: "app=ems-guardian"

    networks:
      - ems-network

  # Optional: Audit log persistence (pre-existing sidecar, unchanged)
  log-collector:
    image: elasticsearch:8.0.0
    container_name: ems-guardian-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - ems-network
    ports:
      - "9200:9200"
    restart: on-failure:5
    deploy:
      resources:
        limits:
          memory: 1G

networks:
  ems-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  elasticsearch_data:
    driver: local
